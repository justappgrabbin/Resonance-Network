name: Build Resonance Network APK

on:
  push:
    branches:
      - stellar-proximology
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm install --legacy-peer-deps

      - name: Verify Expo config
        run: npx expo config --type public

      - name: Generate Android native project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Repair generated splash color resource
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/res/values/colors.xml")
          p.parent.mkdir(parents=True, exist_ok=True)
          if p.exists():
              text = p.read_text()
              if 'name="splashscreen_background"' not in text:
                  text = text.replace("</resources>", '  <color name="splashscreen_background">#07100F</color>\n</resources>')
                  p.write_text(text)
          else:
              p.write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="splashscreen_background">#07100F</color>\n</resources>\n')
          PY

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify standalone APK payload
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | tee /tmp/apk-contents.txt
          grep -q 'assets/index.android.bundle' /tmp/apk-contents.txt
          test "$(stat -c%s "$APK")" -gt 1000000

      - name: Package APK and checksum
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk build-artifacts/Resonance-Network-Stellar-v1.0.2.apk
          sha256sum build-artifacts/Resonance-Network-Stellar-v1.0.2.apk > build-artifacts/Resonance-Network-Stellar-v1.0.2.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resonance-network-stellar-apk
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 30
