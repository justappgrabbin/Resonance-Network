name: Adaptive learning regression
on:
  push:
    branches:
      - feature/resonance-adaptive-learning-20261019
  pull_request:
    paths:
      - 'Core/AdaptiveLabPlanner.js'
      - 'tests/adaptive-lab-planner.test.mjs'
      - '.github/workflows/adaptive-learning.yml'
jobs:
  adaptive-lab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test deterministic selection and profile isolation
        run: node --test tests/adaptive-lab-planner.test.mjs
  android-js-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install existing Expo dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Build the Android JavaScript bundle
        run: npx expo export --platform android --output-dir dist-android
