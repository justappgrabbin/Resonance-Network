services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resonance
      POSTGRES_PASSWORD: resonance-local
      POSTGRES_DB: resonance
    volumes:
      - resonance_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resonance -d resonance"]
      interval: 5s
      timeout: 3s
      retries: 15

  web:
    build: .
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://resonance:resonance-local@postgres:5432/resonance
      START_CONSCIOUSNESS: "0"
      SESSION_SECRET: local-compose-secret-change-me
    ports:
      - "5000:5000"
    volumes:
      - resonance_assets:/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  resonance_pg:
  resonance_assets:
