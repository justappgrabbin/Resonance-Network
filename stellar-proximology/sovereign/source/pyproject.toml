[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-design-llm"
version = "0.4.0"
description = "LLM-native Human Design BodyGraph chart engine, reading generator, career analysis, relationship comparison, timing context, and AI skill toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Zhang Zhaoyang" }
]
dependencies = [
  "pyhd @ git+https://github.com/ppo/pyhd.git@main",
  "tzdata>=2024.1"
]

[project.optional-dependencies]
web = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0"
]
dev = [
  "pytest>=8.0.0",
  "fastapi>=0.110.0",
  "httpx>=0.27.0",
  "uvicorn[standard]>=0.27.0"
]

[tool.setuptools.packages.find]
include = ["human_design*"]

[tool.setuptools.package-data]
human_design = ["assets/*.svg", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
